services:
  app:
    image: ghcr.io/erland/pwa-preview:${PWA_PREVIEW_VERSION:-latest}
    restart: unless-stopped
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      CONTROL_PLANE_HOST: ${CONTROL_PLANE_HOST:?set CONTROL_PLANE_HOST}
      PREVIEW_DOMAIN_SUFFIX: ${PREVIEW_DOMAIN_SUFFIX:?set PREVIEW_DOMAIN_SUFFIX}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      DATA_ROOT: /data
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?set GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?set GITHUB_CLIENT_SECRET}
      MIGRATE_ON_START: "false"
      TTL_MIN_MINUTES: ${TTL_MIN_MINUTES:-5}
      TTL_DEFAULT_MINUTES: ${TTL_DEFAULT_MINUTES:-30}
      TTL_MAX_MINUTES: ${TTL_MAX_MINUTES:-1440}
      MAX_COMPRESSED_BYTES: ${MAX_COMPRESSED_BYTES:-104857600}
      MAX_EXTRACTED_BYTES: ${MAX_EXTRACTED_BYTES:-524288000}
      MAX_FILE_COUNT: ${MAX_FILE_COUNT:-20000}
      MAX_PATH_LENGTH: ${MAX_PATH_LENGTH:-1024}
      URL_FETCH_TIMEOUT_MS: ${URL_FETCH_TIMEOUT_MS:-30000}
      MAX_REDIRECTS: ${MAX_REDIRECTS:-5}
      CLEANUP_INTERVAL_MS: ${CLEANUP_INTERVAL_MS:-60000}
      RECONCILIATION_INTERVAL_MS: ${RECONCILIATION_INTERVAL_MS:-600000}
      STALE_OPERATION_MINUTES: ${STALE_OPERATION_MINUTES:-30}
      STALE_STAGING_MINUTES: ${STALE_STAGING_MINUTES:-60}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pwa-preview-wildcard.rule=HostRegexp(`[a-z0-9-]+\\.${PREVIEW_DOMAIN_SUFFIX}`)"
      - "traefik.http.routers.pwa-preview-wildcard.entrypoints=https"
      - "traefik.http.routers.pwa-preview-wildcard.tls=true"
      - "traefik.http.routers.pwa-preview-wildcard.tls.certresolver=desec"
      - "traefik.http.routers.pwa-preview-wildcard.tls.domains[0].main=${PREVIEW_DOMAIN_SUFFIX}"
      - "traefik.http.routers.pwa-preview-wildcard.tls.domains[0].sans=*.${PREVIEW_DOMAIN_SUFFIX}"
      - "traefik.http.routers.pwa-preview-wildcard.service=pwa-preview-wildcard"
      - "traefik.http.services.pwa-preview-wildcard.loadbalancer.server.port=3000"
    expose:
      - "3000"
    volumes:
      - preview-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  preview-data:
