name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Security regression suite
        run: npm run test:security
      - run: npm run build

  postgres-integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: pwa_preview_test
          POSTGRES_USER: pwa_preview
          POSTGRES_PASSWORD: pwa_preview
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pwa_preview -d pwa_preview_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://pwa_preview:pwa_preview@localhost:5432/pwa_preview_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:integration
      - name: Full E2E
        run: npm run test:e2e

  docker-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate Coolify Compose
        env:
          CONTROL_PLANE_HOST: pwa-preview.example.test
          CONTROL_PLANE_REGISTRABLE_DOMAIN: example.test
          PREVIEW_DOMAIN_SUFFIX: preview.example.test
          SESSION_SECRET: ci-session-secret-that-is-at-least-32-characters
          GITHUB_CLIENT_ID: ci-client
          GITHUB_CLIENT_SECRET: ci-secret
          PWA_PREVIEW_VERSION: ci
        run: docker compose -f compose.coolify.yaml config --quiet
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Report actual ECR Public image digest for pinning
        run: |
          docker buildx imagetools inspect public.ecr.aws/docker/library/node:22.23.3-bookworm-slim
          docker buildx imagetools inspect public.ecr.aws/docker/library/postgres:17-alpine
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: pwa-preview:ci
      - name: Verify native runtime dependencies
        run: docker run --rm pwa-preview:ci node -e "require('sodium-native'); console.log('sodium-native loaded')"
      - name: Verify healthcheck runtime dependency
        run: |
          docker inspect pwa-preview:ci --format '{{json .Config.Healthcheck.Test}}' | grep -q '"node"'
          ! docker inspect pwa-preview:ci --format '{{json .Config.Healthcheck.Test}}' | grep -q '"wget"'


  plugin-package:
    name: Validate Marketplace plugin package
    runs-on: ubuntu-24.04
    env:
      PWA_PREVIEW_MCP_URL: https://pwa-preview.example.test/mcp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Build Marketplace package
        run: npm run plugin:build -- --version 0.0.0-ci --target marketplace
      - name: Validate Marketplace package
        run: |
          test -f build/plugin-marketplace/pwa-preview/plugin.json
          test -f build/plugin-marketplace/pwa-preview/mcp.json
          test -f build/plugin-marketplace/pwa-preview/skills/pwa-preview/SKILL.md
          test -f build/plugin-marketplace/pwa-preview/assets/logo.png
          test -f build/plugin-marketplace/pwa-preview/assets/composer-icon.png
          test ! -e build/plugin-marketplace/pwa-preview/.app.json
          test ! -e build/plugin-marketplace/pwa-preview/.codex-plugin
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('build/plugin-marketplace/pwa-preview/plugin.json'));const o=p.extensions?.['com.openai'];if(p.name!=='pwa-preview'||p.version!=='0.0.0-ci'||p.apps!=null||o?.apps!=null||o?.publication?.countries?.[0]!=='SE'||o?.review?.commerce!==false)process.exit(1)"
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('build/plugin-marketplace/pwa-preview/mcp.json'));if(m.mcpServers['pwa-preview'].type!=='streamable-http'||m.mcpServers['pwa-preview'].url!=='https://pwa-preview.example.test/mcp')process.exit(1)"
