name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Security regression suite
        run: npm run test:security
      - run: npm run build

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pwa_preview_test
          POSTGRES_USER: pwa_preview
          POSTGRES_PASSWORD: pwa_preview
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pwa_preview -d pwa_preview_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://pwa_preview:pwa_preview@localhost:5432/pwa_preview_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:integration
      - name: Full E2E
        run: npm run test:e2e

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Coolify Compose
        env:
          CONTROL_PLANE_HOST: pwa-preview.example.test
          PREVIEW_DOMAIN_SUFFIX: preview.example.test
          DATABASE_URL: postgres://pwa_preview:test@postgres.example.test:5432/pwa_preview
          SESSION_SECRET: ci-session-secret-that-is-at-least-32-characters
          GITHUB_CLIENT_ID: ci-client
          GITHUB_CLIENT_SECRET: ci-secret
          PWA_PREVIEW_VERSION: ci
        run: docker compose -f compose.coolify.yaml config --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pwa-preview:ci
