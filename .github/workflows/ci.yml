name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Security regression suite
        run: npm run test:security
      - run: npm run build

  postgres-integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pwa_preview_test
          POSTGRES_USER: pwa_preview
          POSTGRES_PASSWORD: pwa_preview
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pwa_preview -d pwa_preview_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://pwa_preview:pwa_preview@localhost:5432/pwa_preview_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:integration
      - name: Full E2E
        run: npm run test:e2e

  docker-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate Coolify Compose
        env:
          CONTROL_PLANE_HOST: pwa-preview.example.test
          CONTROL_PLANE_REGISTRABLE_DOMAIN: example.test
          PREVIEW_DOMAIN_SUFFIX: preview.example.test
          DB_HOST: postgres.example.test
          DB_USER: pwa_preview
          DB_PASSWORD: test
          DB_NAME: pwa_preview
          SESSION_SECRET: ci-session-secret-that-is-at-least-32-characters
          GITHUB_CLIENT_ID: ci-client
          GITHUB_CLIENT_SECRET: ci-secret
          PWA_PREVIEW_VERSION: ci
        run: docker compose -f compose.coolify.yaml config --quiet
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: pwa-preview:ci
      - name: Verify native runtime dependencies
        run: docker run --rm pwa-preview:ci node -e "require('sodium-native'); console.log('sodium-native loaded')"
