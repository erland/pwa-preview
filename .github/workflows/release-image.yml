name: Release Docker image and plugin

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/erland/pwa-preview
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}},value=${{ github.event.release.tag_name }}
            type=raw,value=latest,enable=${{ github.event.release.prerelease == false }}

      - name: Build and push release image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-plugin:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      PWA_PREVIEW_MCP_URL: ${{ vars.PWA_PREVIEW_MCP_URL || 'https://pwa-preview.apphome.one/mcp' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Build Marketplace plugin package
        id: plugin
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          npm run plugin:build -- --version "$VERSION" --target marketplace
          mkdir -p build
          (cd build/plugin-marketplace && zip -qr "../pwa-preview-plugin-${VERSION}.zip" pwa-preview)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "archive=build/pwa-preview-plugin-${VERSION}.zip" >> "$GITHUB_OUTPUT"
      - name: Inspect Marketplace plugin archive
        run: |
          unzip -l "${{ steps.plugin.outputs.archive }}"
          unzip -p "${{ steps.plugin.outputs.archive }}" pwa-preview/plugin.json | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const p=JSON.parse(s);if(p.name!=='pwa-preview'||p.version!=='${{ steps.plugin.outputs.version }}'||p.apps!=null||p.extensions?.['com.openai']?.apps!=null)process.exit(1)})"
          unzip -p "${{ steps.plugin.outputs.archive }}" pwa-preview/mcp.json | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const m=JSON.parse(s);if(m.mcpServers?.['pwa-preview']?.url!=='${PWA_PREVIEW_MCP_URL}')process.exit(1)})"
          unzip -p "${{ steps.plugin.outputs.archive }}" pwa-preview/skills/pwa-preview/SKILL.md >/dev/null
          unzip -p "${{ steps.plugin.outputs.archive }}" pwa-preview/assets/logo.png >/dev/null
          unzip -p "${{ steps.plugin.outputs.archive }}" pwa-preview/assets/composer-icon.png >/dev/null
          if unzip -l "${{ steps.plugin.outputs.archive }}" | grep -Eq '\.app\.json|\.codex-plugin/'; then
            echo "Marketplace upload must not contain app bindings or compatibility update manifests." >&2
            exit 1
          fi
      - name: Attach plugin ZIP to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.plugin.outputs.archive }}" --clobber